# gitleaks on every push and pull request: the commits they add must not contain a
# credential (docs/SECRETS.md in openclaw-workspace). Findings are redacted in the log.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          # Pinned: the version the configs are tested with (the action's default is older).
          GITLEAKS_VERSION: 8.28.0
