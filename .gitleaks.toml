# gitleaks settings for CI (.github/workflows/secret-scan.yml): the default rules, minus
# test fixtures that hold fake keys and published test vectors on purpose.
[extend]
useDefault = true

# [allowlist] (not [[allowlists]]): older gitleaks releases ignore the array form.
[allowlist]
description = "Fake credentials and published test vectors in tests"
paths = ['''^test/''']
