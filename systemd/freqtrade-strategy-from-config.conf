# /etc/systemd/system/freqtrade.service.d/strategy-from-config.conf
#
# The main bot takes its strategy from user_data/config.json ("strategy" and, for library
# strategies, "strategy_path") instead of --strategy on the command line, so trading-suite's
# Strategies tab can switch it: write the config, then POST /api/v1/reload_config.
[Service]
ExecStart=
ExecStart=/home/openclaw/.openclaw/worktrees/d89946a92f485818/freqtrade/.venv/bin/freqtrade trade --config user_data/config.json
