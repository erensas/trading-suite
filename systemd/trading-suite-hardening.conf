# /etc/systemd/system/trading-suite.service.d/hardening.conf
[Service]
# Least privilege for a Node web service that runs as openclaw and needs no sudo.
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
CapabilityBoundingSet=
UMask=0077
# Strategy center: bot instances, the strategy library and backtests; managed bots', trading venues'
# and wallets' credentials; the main bot's config file (strategy switch). Everything else in /home
# stays read-only. A listed directory must exist (700, openclaw) before the service starts.
ReadWritePaths=-/home/openclaw/.openclaw/bots -/home/openclaw/.openclaw/credentials/bots -/home/openclaw/.openclaw/credentials/venues -/home/openclaw/.openclaw/credentials/wallets -/home/openclaw/.openclaw/workspace/freqtrade/user_data/config.json
MemoryMax=512M
TasksMax=256
TimeoutStopSec=15
